# moveit_servo.yaml
# ============================================================================
# MoveIt Servo 核心节点参数配置文件
# (供 `/servo_node` 节点使用)
# ============================================================================
#
# 节点职责：接收视觉伺服节点发出的 "Twist" 速度指令，在机械臂工作空间内进行
# 实时插补和奇异点防护，并转化为底层 `ros2_control` 能够执行的 JointTrajectory。
# 该配置通过 `system_sim.launch.py` 传入 `moveit_servo` 参数命名空间。
#

# Gazebo Classic 的 joint_trajectory_controller 可能跳过只有一个、且执行时刻很近
# 的 Servo 轨迹点。Humble MoveIt Servo 在该开关为 true 时会附加冗余轨迹点，
# 防止 Twist 正常发布、status=0，但机械臂完全不动。实机配置仍保持 false。
use_gazebo: true

# 接收的输入命令类型。
# `speed_units` 表示接收速度/角速度指令；`position_units` 表示接收位置偏移指令。
command_in_type: speed_units

# `scale` 仅在 command_in_type=unitless 时生效；当前 speed_units 模式直接使用
# visual_servo.yaml 中的 m/s、rad/s 限速，这里保留 MoveIt Servo 必需的完整配置。
scale:
  linear: 0.10       # 线速度缩放系数
  rotational: 0.20   # 角速度缩放系数
  joint: 0.50        # 关节速度缩放系数

# 伺服更新频率设置（重要参数）。
# Gazebo 运行日志已确认碰撞检查开启时单次 Servo 计算约为 0.10 s。
# 让积分周期与可实现的 10 Hz 执行周期一致，避免按 0.05 s 生成增量、却每
# 0.10 s 才执行一次而使实际角速度减半。实机继续使用独立的 0.05 s 配置。
publish_period: 0.10

# 必须按固定周期输出。视觉节点以 30 Hz 发指令，而每个 JTC 轨迹首点
# 位于 100 ms；若启用 low_latency，33 ms 到来的下一条命令会在上一条轨迹到达
# 首点前不断替换它，表现为 Servo status=0、命令饱和但机械臂几乎不动。
low_latency_mode: false

# 节点输出给控制器的数据类型。
# 输出标准的 JointTrajectory（关节空间轨迹）。
command_out_type: trajectory_msgs/JointTrajectory

# 是否通过输出话题发布期望的关节位置和速度。
publish_joint_positions: true
# Alicia 的 Gazebo JTC 只接受 ``position`` command interface，并配置为拒绝
# 轨迹终点非零速度。若这里附带 Servo 的 velocity 字段，控制器会拒绝整条
# 轨迹，表现为 Twist 正常但机械臂不动。仅发布单点位置轨迹；位置控制器继续
# 以自身 100 Hz 插值执行。
publish_joint_velocities: false
publish_joint_accelerations: false

# 平滑滤波器。
# 指定为 `ButterworthFilterPlugin`，但在低延迟模式下通常效果不大。
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

# 是否充当主规划场景监视器。
# 设置为 `false`，让 `move_group` 节点继续管理规划场景，避免冲突。
is_primary_planning_scene_monitor: false

# ----------------------------------------------------------------------
# 机械臂运动学与坐标系配置 (必须与 URDF/TF 树严格一致)
# ----------------------------------------------------------------------
# MoveIt 规划组名称。
move_group_name: arm
# 机械臂运动学规划参考坐标系 (必须是机械臂基座)。
planning_frame: alicia_base_link
# 末端执行器 (EE) 坐标系。
# 这里设定为 C10 相机的光学坐标系，因为我们的视觉伺服命令是相对于相机光轴的。
ee_frame_name: camera_color_optical_frame
# 接收到的 Twist 指令所在的坐标系。
# 必须和 `visual_servo_node.py` 的 `command_frame` 保持一致。
robot_link_command_frame: camera_color_optical_frame

# ----------------------------------------------------------------------
# 安全超时与报警机制
# ----------------------------------------------------------------------
# 输入指令的超时时间。如果超过 0.3 秒没有收到新的 Twist 指令，机械臂将自动刹车停止。
incoming_command_timeout: 0.30
# 停止指令发出时，向底层控制器发送的刹车消息数量，确保控制器停稳。
num_outgoing_halt_msgs_to_publish: 5

# ----------------------------------------------------------------------
# 奇异点 (Singularity) 防护配置 (MoveIt Servo 核心功能)
# ----------------------------------------------------------------------
# 关节空间的雅可比矩阵条件数阈值。
# - 当条件数 > 17.0 时 (接近奇异点)，MoveIt Servo 会自动减小缩放系数进行降速避让。
lower_singularity_threshold: 17.0
# 当条件数 > 30.0 时 (进入奇异点)，直接触发硬停止，彻底切断运动指令。
hard_stop_singularity_threshold: 30.0
# 当条件数 < 17.0/2.0 时，认为机械臂已安全离开奇异区，恢复正常速度。
leaving_singularity_threshold_multiplier: 2.0

# 关节极限的安全余量。
# 一旦超过关节物理限位，且余量小于 0.10 rad，将触发安全保护。
joint_limit_margin: 0.10

# ----------------------------------------------------------------------
# 输入/输出话题配置
# ----------------------------------------------------------------------
# 接收来自 `wvcsc_visual_servo` 节点的笛卡尔 Twist 速度指令。
cartesian_command_in_topic: /servo_node/delta_twist_cmds
# 接收来自其他节点（如有）的关节空间增量指令。
joint_command_in_topic: /servo_node/delta_joint_cmds

# 获取机械臂当前的关节状态反馈。
joint_topic: /joint_states
# 发布 MoveIt Servo 自身的状态码和警告信息。
status_topic: /servo_node/status
# 输出给 `ros2_control` 控制器的最终轨迹。
command_out_topic: /arm_controller/joint_trajectory

# ----------------------------------------------------------------------
# Gazebo 碰撞保护
# ----------------------------------------------------------------------
# 是否启用底层碰撞检查 (非常重要)。
# 仿真与实机都必须启用，防止视觉伺服旋转腕部后碰撞车顶。
check_collisions: true

# 碰撞检查频率 (Hz)，仅在 `check_collisions: true` 时生效。
collision_check_rate: 10.0
# 自碰撞安全距离阈值 (米)。当机械臂连杆间距小于 0.01m 时，判定为接近碰撞。
self_collision_proximity_threshold: 0.01
# 场景碰撞安全距离阈值 (米)。当机械臂与外部环境 (如仿真树) 间距小于 0.02m 时，判定为碰撞。
scene_collision_proximity_threshold: 0.02
