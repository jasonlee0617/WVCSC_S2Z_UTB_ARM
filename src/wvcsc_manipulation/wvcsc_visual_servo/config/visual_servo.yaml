# visual_servo.yaml
# ============================================================================
# 视觉伺服 (wvcsc_visual_servo) 节点参数配置文件
# ============================================================================
#
# 节点职责：接收 C10 RGB 相机图像中目标 (Target2D) 的像素偏差，通过 PID 控制器
# 计算速度指令 (Twist)，并发布给 MoveIt Servo 节点，实现对目标的实时伺服对准。
# 本参数严格控制了控制频率、收敛精度、安全保护及底层的速度/加速度限制。
#

wvcsc_visual_servo:
  ros__parameters:

    # ----------------------------------------------------------------------
    # 1. ROS 话题与服务接口配置
    # ----------------------------------------------------------------------
    # 对外暴露的 Action 服务名称，供 `spray_task` 调用以锁定并执行单目标对准。
    action_name: /vision/align_target

    # 输入话题：视觉感知模块发布的当前锁定目标像素信息。
    target_topic: /vision/target
    # 输入话题：相机内参信息，用于将图像像素误差转换为真实角度误差。
    camera_info_topic: /camera/color/camera_info
    # 输出话题：计算出的笛卡尔速度指令，发布给 MoveIt Servo 节点。
    twist_topic: /servo_node/delta_twist_cmds
    # 输入话题：MoveIt Servo 节点的工作状态和警告码（用于检测奇异点）。
    servo_status_topic: /servo_node/status
    # 输入话题：机械臂的关节状态反馈（当前仅用于调试日志）。
    joint_state_topic: /joint_states
    # MoveIt Servo 发给 ros2_control 的最终轨迹；仅订阅用于闭环执行诊断。
    servo_command_out_topic: /arm_controller/joint_trajectory

    # MoveIt Servo 只在首个对齐任务启动一次。每颗果实结束时发送零 Twist
    # 制动，避免 Gazebo 组件容器内 pause/unpause 服务的响应阻塞。
    start_servo_service: /servo_node/start_servo
    # The same calibrated nozzle aim is requested by SprayTask before recenter.
    aim_service_name: /vision/compute_spray_aim

    # 速度指令参考的坐标系 (必须是 C10 相机的光学坐标系)。
    command_frame: camera_color_optical_frame

    # ----------------------------------------------------------------------
    # 2. 控制频率与超时配置
    # ----------------------------------------------------------------------
    # 【核心参数】控制回路频率。
    # 根据文档 `11.9` 节 "视觉控制 30 Hz 分层升级"，设定为 30 Hz。
    # 这要求感知节点必须以不低于 30 Hz 的频率发布 Target2D。
    control_rate_hz: 30.0

    # 全局默认对准超时时间（秒）。
    default_timeout_sec: 8.0
    # 单个 Goal 允许的最大/最小超时限制。
    min_goal_timeout_sec: 0.5
    max_goal_timeout_sec: 30.0

    # ----------------------------------------------------------------------
    # 3. 目标状态与有效时限
    # ----------------------------------------------------------------------
    # 目标连续无效（未收到 Target2D）的最大容忍时间。
    # 0.75 秒对应约 22 帧 YOLO 漏检。
    target_stale_timeout_sec: 0.75
    # 无效信号保持时间：当收到无效目标时，保持命令输出 0.25 秒后再进入等待状态。
    # 这防止一帧误检导致伺服剧烈抖动。
    target_invalid_hold_sec: 0.25

    # YOLO 推理置信度的最低准入阈值。
    min_confidence: 0.10

    # ----------------------------------------------------------------------
    # 4. 像素对准精度与收敛容差（核心闭环指标）
    # ----------------------------------------------------------------------
    # 粗调阈值：当像素误差小于 20px 时，伺服进入减速区（配合近目标速度缩放）。
    coarse_tolerance_px: 20.0
    # 单树实测分割点在静止时会抖动到 6.4px。统一使用 8px 圆形误差，
    # 取消“零速保持但又不判成功”的死区，与 ±8px 喷洒验收线一致。
    fine_tolerance_px: 8.0
    # 与成功阈值保持一致，不再额外引入迟滞区间。
    control_resume_tolerance_px: 8.0

    # 稳定时间：误差连续保持在 `fine_tolerance_px` 内的秒数，达到此值才上报对齐成功。
    stable_duration_sec: 0.50

    # 进度窗口与最小进度：如果在 4.0 秒内，误差缩小幅度少于 1.0px，
    # 则认为伺服运动陷入卡顿（Stalled），触发超时退出并切换观察角度。
    progress_window_sec: 4.0
    min_progress_px: 1.0

    # 喷嘴投影点上的残余像素微调。几何主补偿来自camera->spray_nozzle_link TF；
    # 仿真默认无需trim，实机湿喷标定后由nozzle.yaml覆盖。
    desired_offset_u_px: 0.0
    desired_offset_v_px: 0.0

    # 喷嘴轴线投影补偿使用每个观察位的真实几何工距；任何CameraInfo/TF/几何
    # 异常均拒绝伺服，禁止退化到图像中心后误喷。
    aim_compensation_enabled: true
    aim_range_source: goal
    aim_range_min_m: 0.20
    aim_range_max_m: 2.00
    aim_nozzle_frame: spray_nozzle_link
    aim_min_forward_axis_z: 0.2
    aim_image_margin_px: 20.0

    # ----------------------------------------------------------------------
    # 5. 相机内参容错
    # ----------------------------------------------------------------------
    # 仅在显式关闭 require_camera_info 的非喷洒诊断场景使用以下备用焦距；
    # 喷嘴补偿启用时始终要求真实 CameraInfo，禁止用默认内参执行喷洒。
    fallback_fx: 507.872735
    fallback_fy: 507.872735
    # 是否强制等待 CameraInfo。
    require_camera_info: true

    # ----------------------------------------------------------------------
    # 6. PID 控制器参数（图像平面 XY 轴独立控制）
    # ----------------------------------------------------------------------
    # 像素误差先除以焦距变为弧度。执行链恢复后以中等增益作为基线，避免
    # 曾经的 12.0 增益在控制器真正跟随轨迹后造成饱和、过冲或奇异点逼近。
    pid_kp_xy: 4.00
    # 积分增益 (KI=0.0) 关闭。喷嘴几何补偿与 MoveIt 重心已消除稳态大误差，
    # 仅由比例和微分项完成 4px 内的稳定对准。
    pid_ki_xy: 0.0
    # 微分增益 (KD=0.005) 很小，用于补偿视觉运动产生的微小阻尼。
    pid_kd_xy: 0.005

    # 微分项 EMA 平滑滤波系数 (Alpha=0.65)，用于平滑单帧像素剧烈跳变带来的速度冲击。
    pid_d_ema_alpha: 0.65
    # 微分项限幅 (2.0)，防止单帧像素跳变过大导致速度指令突变。
    derivative_clip_xy: 2.0
    # 积分限幅 (0.10)，防止积分项在长时间无视觉反馈时无限累加。
    integral_limit_xy: 0.10

    # ----------------------------------------------------------------------
    # 7. 速度与加速度限制 (平移运动)
    # ----------------------------------------------------------------------
    # 视觉伺服 (眼睛在手 Eye-in-Hand) 模式下，相机光轴方向受姿态微调影响。
    max_linear_speed: 0.08      # 最大线速度 0.08 m/s
    max_linear_acceleration: 0.60 # 最大线加速度 0.60 m/s²

    # 接近目标时的降速策略。
    # 当处于近目标区 (`coarse_tolerance_px = 20px` 以内) 时，速度乘以 `1.0` (不降速)。
    near_target_speed_scale: 1.0
    # 当误差小于 6.0px 时（非常接近最终目标），应用 `near_target_control_scale=0.35` 进行强力降速。
    # 这个 0.35 的系数是为了防止 PID 在极小像素偏差下发生过冲和振荡。
    near_target_control_threshold_px: 6.0
    near_target_control_scale: 0.35

    # 当 MoveIt Servo 返回减速状态（如接近奇异点）时，是否对视觉命令应用缩放。
    warning_speed_scale: 1.0

    # 目标位置预测参数 (Precision Control)。
    # 目标经过视觉感知层（YOLO/Kalman）已经进行了平滑。这里不再进行预测 (lead=0.0)，
    # 避免在接近 1.5px 的微调阶段产生过冲。
    predict_lead_sec: 0.0
    max_predict_horizon_sec: 0.05

    # ----------------------------------------------------------------------
    # 8. 指令模式转换 (Angular vs Linear)
    # ----------------------------------------------------------------------
    # 命令模式：`angular_xy` 或 `linear_xy`。
    # 本项目使用 `angular_xy` (图像平面上可调节 X/Y 轴的角速度)。
    # 因为相机安装在机械臂末端 (Eye-in-Hand)，固定喷洒距离已由 MoveIt 规划保证，
    # 本节点不控制深度，仅通过微小的俯仰/偏航旋转，将病果“拉”回图像中心。
    command_mode: angular_xy

    # Image-axis direction defaults.  The simulation/nominal camera mounting
    # uses the optical-frame convention directly; real hardware may override
    # either sign after an observed low-speed response check.
    angular_u_sign: 1.0
    angular_v_sign: 1.0

    # Disabled by default so simulation behavior remains unchanged.  The
    # real profile enables this one-shot guard to stop instead of spraying if
    # a locked target moves farther from the nozzle aim after control begins.
    direction_guard_enabled: false
    direction_guard_window_sec: 1.0
    direction_guard_min_error_px: 20.0
    direction_guard_max_growth_px: 10.0
    direction_guard_min_confidence: 0.60

    # 角速度/角加速度限制。
    max_angular_speed: 0.45          # 最大角速度 0.45 rad/s
    max_angular_acceleration: 3.00   # 最大角加速度 3.00 rad/s²

    # ----------------------------------------------------------------------
    # 8.1 下游 MoveIt Servo / JTC 执行链看门狗
    # ----------------------------------------------------------------------
    # 视觉闭环不能把“发布 Twist”误认为“机械臂已运动”。若下游轨迹停止、
    # 频率过低，或控制器拒绝全部轨迹，本节点在该窗口后安全退出并给任务层
    # 明确错误，而不是无意义地等待视觉超时。
    servo_response_timeout_sec: 0.75
    servo_min_output_rate_hz: 8.0
    servo_min_commanded_joint_delta_rad: 0.01
    servo_min_actual_joint_delta_rad: 0.002

    # ----------------------------------------------------------------------
    # 9. 停止与状态码管理
    # ----------------------------------------------------------------------
    # 停止前发送零速度指令的数量。
    # 8 条零指令 / 30 Hz ≈ 0.267 秒。每个对齐 Action 结束时发布，确保
    # 底层控制器完全停车；下一颗果实直接复用已经启动的 Servo 循环。
    zero_command_count: 8

    # 首次 start 单独允许等待 Servo 完整状态。
    initial_start_timeout_sec: 12.0

    # MoveIt Servo 状态码分类策略（需与 `servo_status_policy.py` 保持一致）。
    # 减速码 (1, 3)：接近奇异点/碰撞，视觉节点降速但继续运行。
    servo_status_decel_codes: [1, 3]
    # 透传码 (6)：离开奇异点的过渡状态，视觉节点可忽略，继续正常控制。
    servo_status_passthrough_codes: [6]
    # 可恢复停止码 (2)：进入奇异点，视觉节点应立即停止运动并通知任务管理器切换视角。
    servo_singularity_status_code: 2
    # 硬停止码 (4, 5)：撞到关节限位或严重碰撞，必须触发安全停止。
    servo_status_halt_codes: [4, 5]
