# mission_manager.yaml
# ============================================================================
# 任务调度核心节点 (wvcsc_mission_manager) 参数配置文件
# ============================================================================
#
# 职责：
# 控制 Qt/RViz 人工任务的执行节奏：从加载任务点，到控制 Nav2 进行点到点
# 导航，再到调用机械臂喷洒闭环，最后循环推进至任务完成。
#
# 核心原则：
# 1. 树级任务管理器，仅负责排队、超时、状态汇报和跳转。
# 2. 病果的具体识别、视觉对准和喷洒轨迹由 `wvcsc_spray_task` 负责。
#

mission_manager:
  ros__parameters:
    # 机器人导航与任务使用的全局坐标系 (必须与 Nav2 和 Cartographer 一致)
    map_frame: map

    # Nav2 的 Action 服务名称。
    nav_action_name: /navigate_to_pose
    # 机械臂喷洒动作的 Action 服务名称 (调用 `wvcsc_spray_task`)
    spray_action_name: /arm/execute_spray

    # 机械臂基座原点相对 base_footprint 的平面安装偏移，须与整车 URDF 一致。
    arm_base_forward_offset_m: -0.40
    arm_base_left_offset_m: 0.0
    # 仿真通用默认值；实车入口按 alicia_mount_joint 覆盖为 pi。
    arm_base_yaw_rad: 0.0

    # ----------------------------------------------------------------
    # 通讯超时控制
    # ----------------------------------------------------------------
    # Nav2 单次导航任务的最大超时时间 (120秒)。
    nav_goal_timeout_sec: 120.0
    # 启动时 Nav2 可能处于生命周期(Lifecycle)激活过程中，专门给首次导航的宽容重试窗口。
    nav_startup_retry_timeout_sec: 30.0
    nav_startup_retry_interval_sec: 0.5

    # 机械臂喷洒 Action 的超时时间。
    spray_goal_timeout_sec: 180.0
    # 对准过程会转发视觉伺服反馈；40 秒无反馈才认为子 Action 真正失联。
    spray_progress_timeout_sec: 40.0

    # 第 1 路广域喷洒。生产闭环必须确认继电器服务可用；ON/OFF 命令失败
    # 会停住车辆并使任务失败，禁止在喷洒状态未知时继续行驶。
    relay_service_name: /relay/set
    require_relay_service: true
    wide_relay_channel: 1
    arm_relay_channel: 2
    wide_spray_motion_linear_threshold: 0.03
    wide_spray_motion_timeout_sec: 10.0

    # ----------------------------------------------------------------
    # HOME (待命/充电) 位姿配置
    # ----------------------------------------------------------------
    # 任务完成后是否自动返回 HOME 点。
    return_home_after_mission: false
    home_x: 0.0
    home_y: 0.0
    home_yaw: 0.0

    # ----------------------------------------------------------------
    # 停稳检测 (Stop Detector) 阈值
    # ----------------------------------------------------------------
    # 线速度和角速度阈值，低于此值判定小车为静止。
    linear_stop_threshold: 0.03      # 0.03 m/s
    angular_stop_threshold: 0.03     # 0.03 rad/s
    # 小车速度持续稳定在阈值以下必须持续 1.0 秒，才视为完全停稳。
    stop_stable_duration_sec: 1.0
    # 如果 1.0 秒内没有收到新的 /odom 消息，视为里程计失联。
    odom_stale_timeout_sec: 1.0
    # 等待小车停稳的最大总时间 (5秒后还未稳定，任务判定失败)。
    stop_verify_timeout_sec: 5.0

    # ----------------------------------------------------------------
    # 任务校验阈值
    # ----------------------------------------------------------------
    # 单次 Qt 路线最多允许的 Point 数，支持当前 23 株病株及通行点。
    max_points: 64
    # 任务坐标的最大绝对值限制 (防止异常的坏数据导航到地图外)。
    max_abs_coordinate: 50.0
    # 喷洒持续时间 (秒) 的安全边界。
    min_spray_duration: 0.2
    max_spray_duration: 10.0
