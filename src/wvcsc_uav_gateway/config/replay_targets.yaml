# replay_targets.yaml
# ============================================================================
# 无人机任务回放配置文件 (Replay Mode)
# ============================================================================
#
# 用途：
# 1. 模拟无人机在不同时间点发现病树并广播任务。
# 2. 适合配合视频回放进行比赛演示，实现任务与视频画面的同步。
#

replay:
  # 回放倍速。1.0 表示实际时间流速，2.0 表示 2 倍速快速播放。
  playback_rate: 1.0

  # 是否开启循环播放 (完成一轮任务后自动重新开始)。
  loop: false

  # 循环播放时，两轮任务之间的间隔时间。
  loop_delay_sec: 1.0

  # 具体的事件触发列表。
  events:
    # 在仿真开始后的 0.5 秒触发一次任务。
    - at_sec: 0.5
      mission:
        mission_id: replay_demo_001
        frame_id: map
        source_mode: replay
        trees:
          - tree_id: tree_01
            confidence: 0.96
            position: {x: 3.0, y: 2.0, z: 0.0}
            spray_side: left
            spray_duration: 2.0
            evidence_uri: file:///data/replay/tree_01.jpg
          - tree_id: tree_02
            confidence: 0.94
            position: {x: 5.0, y: -2.0, z: 0.0}
            spray_side: right
            spray_duration: 2.0
            evidence_uri: file:///data/replay/tree_02.jpg