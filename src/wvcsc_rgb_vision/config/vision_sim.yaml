wvcsc_alignment_gate:
  ros__parameters:
    target_topic: /vision/target
    action_name: /vision/align_target
    tolerance_u: 20.0
    tolerance_v: 20.0
    min_confidence: 0.7
    stable_frames: 5
    stale_timeout_sec: 0.5
    min_goal_timeout_sec: 0.5
    max_goal_timeout_sec: 30.0

wvcsc_mock_vision:
  ros__parameters:
    image_width: 1280
    image_height: 720
    error_u: 0.0
    error_v: 0.0
    confidence: 0.95
    publish_rate_hz: 10.0
