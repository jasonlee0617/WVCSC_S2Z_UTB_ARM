# Passed under the `moveit_servo` parameter namespace by system_sim.launch.py.
# gazebo_ros2_control accepts the normal one-point Servo trajectory.  The
# legacy Gazebo workaround expands every command to many points, which hides
# the real controller cadence and delays visual feedback.
use_gazebo: false
command_in_type: speed_units
scale:
  linear: 0.10
  rotational: 0.20
  joint: 0.50
# Gazebo profile optimized for sub-50 ms Servo cycle.  ``low_latency_mode``
# removes non-critical synchronisation; the Butterworth filter is disabled
# to avoid adding one frame of latency.  Collision checking remains off so
# that the synchronous callback cannot starve the twist pipeline.
publish_period: 0.05
low_latency_mode: true
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
is_primary_planning_scene_monitor: false
move_group_name: arm
planning_frame: alicia_base_link
ee_frame_name: camera_color_optical_frame
robot_link_command_frame: camera_color_optical_frame
incoming_command_timeout: 0.30
num_outgoing_halt_msgs_to_publish: 5
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.10
leaving_singularity_threshold_multiplier: 2.0
cartesian_command_in_topic: /servo_node/delta_twist_cmds
joint_command_in_topic: /servo_node/delta_joint_cmds
joint_topic: /joint_states
status_topic: /servo_node/status
command_out_topic: /arm_controller/joint_trajectory
# Gazebo-only profile: Humble's synchronous Servo collision callback blocks
# Twist processing for ~0.5 s in this scene. Observation/recenter IK and MoveIt
# trajectories still use collision checking. Re-enable and retune for hardware.
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
