wvcsc_visual_servo:
  ros__parameters:
    action_name: /vision/align_target
    target_topic: /vision/target
    camera_info_topic: /camera/camera/color/camera_info
    twist_topic: /servo_node/delta_twist_cmds
    servo_status_topic: /servo_node/status
    joint_state_topic: /joint_states
    debug_topic: /vision/visual_servo_debug
    debug_rate_hz: 5.0
    # Human-readable terminal progress only; it does not affect the 30 Hz loop.
    terminal_status_rate_hz: 1.0
    start_servo_service: /servo_node/start_servo
    stop_servo_service: /servo_node/stop_servo
    command_frame: camera_color_optical_frame
    # Performance-first Gazebo profile; retune conservatively before hardware.
    control_rate_hz: 30.0
    default_timeout_sec: 8.0
    min_goal_timeout_sec: 0.5
    max_goal_timeout_sec: 30.0
    target_stale_timeout_sec: 0.75
    target_invalid_hold_sec: 0.25
    min_confidence: 0.10
    coarse_tolerance_px: 20.0
    # Leave margin to the stated < 2 px requirement and detector jitter.
    fine_tolerance_px: 1.5
    # Once a target has entered the final tolerance, suppress PID commands
    # until noise clearly exceeds the final radius. A wide 3 px band could
    # hold zero forever at 2-3 px and make the strict 1.5 px success condition
    # unreachable, so keep only a narrow 0.5 px hysteresis band.
    control_resume_tolerance_px: 2.0
    stable_duration_sec: 0.50
    progress_window_sec: 4.0
    min_progress_px: 1.0
    desired_offset_u_px: 0.0
    # Camera is about 55 mm from the tool0 axis: fy * 0.055 / 1.0 m.
    desired_offset_v_px: 28.0
    fallback_fx: 507.872735
    fallback_fy: 507.872735
    require_camera_info: true
    pid_kp_xy: 4.00
    pid_ki_xy: 0.0
    pid_kd_xy: 0.005
    pid_d_ema_alpha: 0.65
    derivative_clip_xy: 2.0
    integral_limit_xy: 0.10
    max_linear_speed: 0.08
    max_linear_acceleration: 0.60
    near_target_speed_scale: 1.0
    near_target_control_threshold_px: 6.0
    near_target_control_scale: 0.35
    # MoveIt Servo already scales status-1 commands from condition 17 to 30.
    # Do not apply a second 0.35 multiplier in the IBVS node.
    warning_speed_scale: 1.0
    # The target is already temporally filtered by perception. Extrapolating a
    # one-frame mask fluctuation produced avoidable near-target overshoot.
    predict_lead_sec: 0.0
    max_predict_horizon_sec: 0.05
    # Eye-in-hand image alignment is angular: after MoveIt places the camera
    # inside the 48 px work area, small pitch/yaw corrections move the target
    # across the image faster than camera translation while preserving distance.
    command_mode: angular_xy
    max_angular_speed: 0.45
    max_angular_acceleration: 3.00
    # 8 / 30 Hz ~= 0.267 s: preserve the pre-stop zero-command duration.
    zero_command_count: 8
    service_timeout_sec: 2.0
    servo_status_decel_codes: [1, 3]
    servo_status_passthrough_codes: [6]
    servo_singularity_status_code: 2
    servo_status_halt_codes: [4, 5]
