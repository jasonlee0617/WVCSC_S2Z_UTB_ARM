# vision_sim.yaml
# ============================================================================
# WVCSC 感知流水线 (wvcsc_perception_pipeline) 参数配置文件
# ============================================================================
#
# 节点职责：
# 1. 订阅 C10 相机图像，根据 `inference_mode` (idle/disease/target)
#    对整幅画面执行病态目标推理。
# 2. 输出 `/vision/diseased_target_detections`。
# 3. 在目标锁定模式下，对特定病态目标的掩膜进行深度处理，获取安全喷洒点
#    (`aim_u/v`)，并发布给视觉伺服节点。
#

wvcsc_perception_pipeline:
  ros__parameters:

    # ----------------------------------------------------------------------
    # 1. 话题与服务接口配置
    # ----------------------------------------------------------------------
    # 输入话题：C10 RGB 相机原始图像 (640x480)
    image_topic: /camera/color/image_raw

    # 输入话题：从 `spray_task` 发来的“当前要锁定的目标 ID”
    selected_target_topic: /vision/selected_target_id

    # 输出话题：病态目标实例分割或检测结果
    diseased_target_detections_topic: /vision/diseased_target_detections
    # 输出话题：最终发送给视觉伺服的 Target2D 目标 (包含用于喷洒的安全像素点)
    target_topic: /vision/target

    # 调试可视化话题 (发布带标注的 OpenCV 图像)
    diseased_target_visualization_topic: /vision/diseased_target_debug_image

    # 输入话题：控制感知阶段的推理模式 (idle/disease/target)
    inference_mode_topic: /vision/inference_mode

    # ----------------------------------------------------------------------
    # 2. 模型权重文件配置
    # ----------------------------------------------------------------------
    # 注：相对路径会解析到 `wvcsc_rgb_vision/models/` 目录下。
    # `s` 代表 YOLOv8 Small 版本，在 NVIDIA 嵌入式平台(如 Jeston)上有较好平衡。
    # 默认保持分割：掩膜安全点作为 Target2D.center_u/v。
    # detect 实验模型需显式改为 detect，并配套 detect 权重。
    disease_model_backend: segment
    disease_model_path: yolov8s_seg_sim.pt
    target_class_id: 0
    target_class_name: diseased_target
    target_id_prefix: target
    # 仿真权重原生为 segment:{0: diseased_fruit}，ROS 输出统一为 diseased_target。
    strict_model_classes: true

    # ----------------------------------------------------------------------
    # 3. 推理与置信度阈值
    # ----------------------------------------------------------------------
    # 病果分割的最低置信度 (YOLO 的分割掩膜即使置信度低，仍具有较好的边界特征)
    disease_confidence: 0.10
    # 仿真输出所有病果目标。
    max_diseased_targets: 0


    # ----------------------------------------------------------------------
    # 4. 短期目标跟踪 (Tracking) 配置
    # ----------------------------------------------------------------------
    # 连续两帧间如果 IoU > 0.20，判定为同一个目标，赋予相同的 `target_id`。
    track_iou_threshold: 0.20
    # 如果由于相机镜头畸变导致 IoU 不再重叠，但中心距离 < 50px，也判定为同一目标。
    track_center_distance_px: 50.0
    # 允许 YOLO 连续漏检的最大帧数。
    # 设定为 15 帧，对应约 0.5 秒（~30Hz），覆盖 MoveIt 重心过程中的短时遮挡。
    track_max_missed_frames: 15

    # ----------------------------------------------------------------------
    # 5. 选中目标重关联 (Target Re-association) 配置
    # ----------------------------------------------------------------------
    # 当视觉伺服导致机械臂大幅运动（粗定位），目标在画面中明显漂移时，
    # 使用与任务层跨视角账本一致的距离容差 (320px) 重新关联锁定目标。
    # 该值覆盖最大20度重心后的约185px视差；仍由类别、最近邻和一对一账本约束。
    target_reassociation_distance_px: 320.0
    # 多病果时由下面的几何评分和歧义门限选择唯一候选；不要仅因画面中
    # 存在另一颗病果就让已锁定目标失效。
    target_reassociation_require_unique_candidate: false
    # Gazebo 固定果树在安全重心后可能生成近似并列框。任务层仍保留物理账本，
    # 感知层只在既有的几何门限内选择确定的最近候选，避免无谓 selected_id_missing。
    target_reassociation_allow_ambiguous_nearest: true

    # 重关联时的歧义防护：如果候选目标与参考目标的 IoU 差值小于 0.10，
    # 则认为出现了重关联歧义（两个果实长得太像），此时节点会丢弃目标，
    # 避免视觉伺服喷错病果。
    target_reassociation_iou_margin: 0.10
    target_reassociation_distance_margin_px: 8.0

    # 如果两个重关联候选的安全瞄准点 (aim_u/v) 非常接近（距离 < 8px），
    # 则判定为等效目标，允许重关联。
    target_equivalent_aim_distance_px: 8.0

    # ----------------------------------------------------------------------
    # 6. 安全喷洒点 (Safe Aim Point) 平滑滤波
    # ----------------------------------------------------------------------
    # 由于 YOLO 的分割掩膜存在像素级抖动，导致直接计算的 `aim_u/v`
    # 会发生高频跳变。使用 EMA (指数移动平均) 平滑最终的喷洒点坐标。
    # 0.20 的 Alpha 值在约 30 Hz 的推理频率下，引入了约 0.2 秒的滞后，
    # 有效滤除了掩膜边缘的噪声。
    target_lock_ema_alpha: 0.20

    # ----------------------------------------------------------------------
    # 7. 目标模板匹配 (Template Tracking) 配置
    # ----------------------------------------------------------------------
    # 是否启用在 YOLO 漏检时的临时模板匹配跟踪。
    # 当 YOLO 漏检时，使用 OpenCV 的 `cv2.matchTemplate` 继续锁定目标，
    # 防止视觉伺服因短暂漏检而发生剧烈抖动。
    target_template_tracking_enabled: true

    # 只有当 YOLO 给出的置信度大于 0.30 时，才更新模板。
    # 防止将低质量的“虚影”保存为模板，导致后续匹配偏移。
    target_template_update_min_confidence: 0.30
    # 截取模板区域时，在检测框外侧向外扩展的比例 (50%) 和最小像素边界 (6px)
    target_template_padding_ratio: 0.50
    target_template_min_padding_px: 6.0

    # 使用模板匹配时，在当前帧的搜索范围半径 (80px)。
    target_template_search_radius_px: 80.0
    # 模板匹配的相似度阈值 (NCC, 0~1)。0.55 表示必须有较高相似度才确认目标。
    target_template_min_score: 0.55

    # ----------------------------------------------------------------------
    # 8. 调试可视化
    # ----------------------------------------------------------------------
    # 是否发布带有标注的调试图像（黄色高亮为选中目标，蓝色为安全点）。
    publish_visualization: true
