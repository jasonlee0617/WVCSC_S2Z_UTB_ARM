auto_calibration_collector:
  ros__parameters:
    use_sim_time: true
    # CI/无交互仿真回归时没有可输入 s 的终端；仍调用与手动模式完全相同的
    # 采集状态机。实机配置未设置该参数，默认必须人工按 s/Enter 启动。
    auto_start: true
    calibration_output_dir: $HOME/WVCSC_S2Z_UTB_ARM/src/wvcsc_perception/wvcsc_calibration/config
    calibration_file_prefix: c10_handeye_sim
    calibration_simulation: true
    velocity_scaling: 0.20
    acceleration_scaling: 0.20
    # Gazebo 的 joint_states.velocity 与位置差分不一致，静止性以更可靠的
    # 关节位置收敛窗口判定，避免非零末速度造成图像 PnP 与 TF 的时序错配。
    joint_stationary_max_position_delta_rad: 0.0001
    joint_stationary_window_sec: 0.30
    joint_stationary_timeout_sec: 5.0
    # 仿真启动文件使用此位置生成桌面上的70 mm标定码；采集器本身不再由它
    # 生成自适应候选，而是按官方20点固定关节序列执行。
    # 此处是固定20姿态的覆盖率最优点，而非首姿态的光轴交点：基于当前
    # Alicia-M URDF 和 C10 内参的投影预检，20 个姿态中有 19 个满足严格
    # 60 px 边缘余量、90 px 尺寸和 0.20--0.80 m 距离门槛。因此保留严格
    # 14 样本下限，不降低图像质量标准或重复执行固定姿态表。
    # 坐标在 alicia_base_link 下；z=2 mm 是标定板表面，码面由 launch
    # 以水平、朝上的姿态生成。
    # 640x480 C10 view: this anchor keeps the complete fixed sequence
    # visible with the existing 07:21 automatic-collection poses.
    marker_position_base_m: [0.530, -0.030, 0.002]
    # 仿真允许0.20m的有效PnP距离；距离仍受标记像素尺寸、边缘、稳定性、
    # 共识及最终真值精度门控约束。
    marker_distance_min_m: 0.20
    marker_size_m: 0.070
    stable_marker_pose_topic: /calibration/stable_marker_pose
    stable_tf_settle_sec: 0.15
    # 不改变 stable_frames=10 和任何 C10 图像质量门槛。达到下限即停止遍历；
    # 不足下限直接失败且不保存，不进行第二轮固定姿态采样。
    minimum_samples: 14
    minimum_solution_samples: 14
    # 仿真基准有已知的 tool0->C10 外参，因此采样质量门槛比实机更严：
    # 仅允许内部一致的 marker 位姿集合进入 OpenCV 手眼求解。该门槛
    # 只依据标记位姿残差和算法共识，不使用真值挑选样本。
    maximum_marker_position_rms_m: 0.002
    # 固定表的独立 C10 PnP 回归中，跨姿态角度 RMS 约为 0.58 deg。
    # 0.60 deg 只是求解一致性预筛，不替代后续 1 deg 外参真值门槛。
    maximum_marker_rotation_rms_deg: 0.60
    maximum_algorithm_translation_delta_m: 0.003
    maximum_algorithm_rotation_delta_deg: 1.0
    # 固定表使用独立 C10 PnP；以下尺度只定义固定码一致性优化的残差权重，
    # 不把仿真真值送入求解器，也不改变最终的 3 mm / 2 mm / 1 deg 验收。
    fixed_marker_refinement_enabled: true
    fixed_marker_refinement_translation_sigma_m: 0.00050
    fixed_marker_refinement_rotation_sigma_deg: 0.30
    fixed_marker_refinement_max_iterations: 25

    # 默认仿真使用完整车体碰撞模型，车顶已是规划场景中的真实碰撞边界。
    calibration_surface_enabled: false

    ground_truth_check_enabled: true
    ground_truth_translation_m: [-0.055, 0.0, -0.10]
    ground_truth_rotation_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
    ground_truth_max_translation_error_m: 0.003
    ground_truth_max_xy_error_m: 0.002
    ground_truth_max_rotation_error_deg: 1.0
