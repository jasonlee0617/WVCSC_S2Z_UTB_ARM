auto_calibration_collector:
  ros__parameters:
    use_sim_time: true
    auto_start: false
    camera_intrinsics_source: p
    calibration_output_dir: $HOME/WVCSC_S2Z_UTB_ARM/src/wvcsc_perception/wvcsc_calibration/config/sim
    calibration_file_prefix: c10_handeye_sim
    calibration_simulation: true
    velocity_scaling: 0.20
    acceleration_scaling: 0.20
    joint_stationary_max_position_delta_rad: 0.0001
    joint_stationary_window_sec: 0.30
    joint_stationary_timeout_sec: 5.0
    marker_position_base_m: [0.480, 0.010, 0.002]
    marker_distance_min_m: 0.20
    marker_size_m: 0.070
    stable_marker_pose_topic: /calibration/stable_marker_pose
    stable_tf_settle_sec: 0.15
    minimum_samples: 15
    minimum_solution_samples: 14
    maximum_marker_position_rms_m: 0.002
    maximum_marker_rotation_rms_deg: 0.70
    maximum_algorithm_translation_delta_m: 0.003
    maximum_algorithm_rotation_delta_deg: 1.0
    fixed_marker_refinement_enabled: true
    fixed_marker_refinement_translation_sigma_m: 0.00050
    fixed_marker_refinement_rotation_sigma_deg: 0.30
    fixed_marker_refinement_max_iterations: 25
    calibration_surface_enabled: false
    ground_truth_check_enabled: true
    ground_truth_translation_m: [-0.055, 0.0, -0.10]
    ground_truth_rotation_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
    ground_truth_max_translation_error_m: 0.003
    ground_truth_max_xy_error_m: 0.002
    ground_truth_max_rotation_error_deg: 1.0
