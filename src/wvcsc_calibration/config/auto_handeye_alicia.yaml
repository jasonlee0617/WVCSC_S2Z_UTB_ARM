auto_calibration_collector:
  ros__parameters:
    use_sim_time: false
    group_name: arm
    base_frame: alicia_base_link
    tool_link: tool0
    camera_frame: camera_color_optical_frame
    marker_frame: calibration_aruco
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    planner_id: RRTConnectFast
    planning_pipeline_id: ompl
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    planning_time: 5.0
    execution_timeout: 90.0

    marker_id: 1
    marker_size_m: 0.070
    # 每个样本先用本进程的角点亚像素PnP稳定窗口更新marker TF，再调用
    # easy_handeye2。实机仍使用同一条路径，不引入仿真专用采样逻辑。
    stable_marker_pose_topic: /calibration/stable_marker_pose
    stable_tf_settle_sec: 0.15
    aruco_dictionary: DICT_5X5_250
    image_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    joint_state_topic: /joint_states
    motion_locked_topic: /motion_control/locked
    motion_state_topic: /motion_control/state

    minimum_samples: 15
    minimum_solution_samples: 14
    # 20个官方Alicia-M固定关节样本由统一采集器按既定顺序执行；每点仍需
    # 通过MoveIt碰撞规划、条件数、关节余量、停稳和C10图像质量门控。
    stable_frames: 10
    settle_time_sec: 1.0
    # 每次轨迹结束后，连续 0.30 s 内六关节位置最大跨度必须不超过该值，
    # 才允许把图像 PnP 与最新 tool0 TF 组成手眼样本。位置收敛直接反映
    # TF 是否仍在运动；不满足时拒绝该候选，不放宽精度。
    joint_stationary_max_position_delta_rad: 0.0005
    joint_stationary_window_sec: 0.30
    joint_stationary_timeout_sec: 5.0
    marker_distance_min_m: 0.25
    marker_distance_max_m: 0.80
    minimum_corner_margin_px: 60.0
    minimum_marker_side_px: 90.0
    maximum_center_std_px: 4.0
    maximum_marker_depth_std_m: 0.003
    maximum_marker_angle_std_deg: 0.8
    minimum_translation_delta_m: 0.006
    minimum_rotation_delta_deg: 3.0
    minimum_translation_span_m: 0.04
    minimum_rotation_span_deg: 20.0

    # The official fixed 20-pose sequence evaluates to about 21.5--32.9 in
    # Alicia-M's URDF Jacobian convention.  Keep a finite calibration safety
    # gate without rejecting every official sample; task-motion limits remain
    # independent in wvcsc_arm_task.
    max_condition_number: 35.0
    min_joint_margin_rad: 0.22

    algorithm_names: [OpenCV/Park, OpenCV/Horaud, OpenCV/Tsai-Lenz]
    maximum_algorithm_translation_delta_m: 0.010
    maximum_algorithm_rotation_delta_deg: 2.0
    maximum_camera_translation_norm_m: 0.30
    maximum_marker_position_rms_m: 0.005
    maximum_marker_rotation_rms_deg: 1.0
    easy_service_timeout_sec: 10.0
    startup_service_timeout_sec: 20.0
    calibration_output_dir: $HOME/WVCSC_S2Z_UTB_ARM/src/wvcsc_calibration/config
    calibration_file_prefix: c10_handeye
    calibration_simulation: false
    # 实机必须由操作者按 s/Enter 确认工作区安全后才开始运动。
    auto_start: false
