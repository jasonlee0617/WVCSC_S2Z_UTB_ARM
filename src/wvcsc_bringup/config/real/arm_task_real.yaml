wvcsc_spray_task:
  ros__parameters:
    # Real model is leaf-only; ROS interface uses the shared diseased_target name.
    target_class_name: diseased_target
    disease_confidence: 0.25
    # One real-tree task may spray only the two highest-confidence leaves.
    max_targets_per_tree: 2
    # One static real-world observation must persist across a full sliding
    # window before it enters the frozen two-target ledger.
    view_detection_duration_sec: 7.0
    target_presence_window_sec: 2.0
    target_presence_ratio: 0.50
    target_presence_min_frames: 5
    post_spray_home_delay_sec: 2.0
    target_post_recenter_min_confidence: 0.30
    # Real hardware follows the same coarse-MoveIt + Visual Servo path as
    # simulation.  TIMEOUT, TARGET_STALE, or output stall may spray once from
    # the current servo pose, then recheck pending targets.  Singularity only
    # permits observation recovery/retry; collision, limit, direction, and
    # safety-stop gates still prohibit endpoint spray.
    spray_on_alignment_failure: true

    # Field-validated scans for both sides of alicia_base_link.  These are
    # planned by MoveIt in joint space; they are not sent directly to the arm
    # controller.  The right-side values are independently measured, not
    # mirrored from the left-side set.
    observation_mode: joint_presets
    joint_preset_center_deg: [95.3, -136.9, -71.0, 7.7, 57.3, -4.4]
    joint_preset_fan_left_deg: [52.2, -131.7, -55.4, -58.9, 76.5, 18.2]
    joint_preset_fan_right_deg: [118.5, -129.4, -55.8, 47.6, 66.2, -17.1]
    joint_preset_right_center_deg: [-105.4, -127.8, -50.5, -15.4, 71.2, -4.9]
    joint_preset_right_fan_left_deg: [-139.8, -128.6, -57.3, -70.1, 79.7, 13.0]
    joint_preset_right_fan_right_deg: [-70.8, -126.8, -50.6, 32.2, 69.8, -12.1]
    joint_preset_side_epsilon_m: 0.05

    # ``joint_presets`` is MoveIt joint-space planning, not direct FK output.
    # A target outside 48px receives collision-aware MoveIt coarse alignment
    # before Visual Servo takes over.  The Servo entry window is deliberately
    # no larger than the recenter trigger; it is not a spray-distance gate.
    target_recenter_trigger_px: 48.0
    target_recenter_workspace_px: 128.0
    visual_servo_entry_max_error_px: 48.0
    target_post_recenter_stable_sec: 0.50
    # A single field-of-view correction may exceed the generic 20deg default.
    # Final motion still must pass collision IK, kinematic and OMPL checks.
    target_recenter_max_angle_deg: 45.0
    target_recenter_max_total_angle_deg: 45.0

    max_alignment_attempts: 2
    vision_timeout_sec: 30.0
    spray_action_name: /spray/execute
    vision_action_name: /vision/align_target

    # 树叶主要分布在树根以上 0.80--1.80 m；首个 Look-at 观察位对准中点。
    observation_center_height_m: 1.30
    observation_camera_reach_min_m: 0.20
    observation_camera_reach_max_m: 0.40
    observation_camera_reach_step_m: 0.10
    # 相机光心相对 alicia_base_link 的 Z 高度；0.20 m 为确认的最小车顶净空。
    camera_height_min_m: 0.15
    camera_height_max_m: 0.30
    camera_height_step_m: 0.10
    observation_azimuth_offsets_deg: [0.0, -12.0, 12.0]
    spray_nozzle_frame: spray_nozzle_link
    observation_nozzle_plane_min_m: 0.20
    observation_nozzle_plane_max_m: 2.00
    # 完整任务会用实测喷嘴标定覆盖这两个参数。
    observation_preferred_nozzle_plane_distance_m: 1.00
    observation_nozzle_plane_tolerance_m: 0.05
    observation_max_condition_number: 16.0

    # Keep automatic execution conservative until measured calibration exists.
    observation_position_tolerance_m: 0.01
    observation_orientation_tolerance_rad: 0.01
