wvcsc_spray_task:
  ros__parameters:
    # Real perception is leaf-only.  No diseased_fruit alias is permitted.
    target_class_name: disease_leaf
    tree_confidence: 0.25
    fruit_confidence: 0.25
    target_post_recenter_min_confidence: 0.30
    spray_working_distance_m: 1.00
    spray_working_distance_tolerance_m: 0.05
    target_recenter_desired_offset_u_px: 0.0
    target_recenter_desired_offset_v_px: 0.0

    max_alignment_attempts: 2
    vision_timeout_sec: 8.0
    spray_action_name: /spray/execute
    vision_action_name: /vision/align_target

    # Corn canopy is approximately 1.8 m high.
    fruit_zone_height_min_m: 0.80
    fruit_zone_height_max_m: 1.60
    fruit_zone_radius_m: 0.60
    observation_min_visible_fraction: 0.60
    observation_distance_min_m: 1.00
    observation_distance_max_m: 1.00
    observation_distance_step_m: 0.10
    camera_height_min_m: 1.40
    camera_height_max_m: 1.80

    # Keep automatic execution conservative until measured calibration exists.
    observation_position_tolerance_m: 0.01
    observation_orientation_tolerance_rad: 0.01
