# 中文说明：实机机械臂喷嘴执行器参数，连接 `/spray/execute` 与继电器通道 2。
# SprayActuator 在继电器成功确认后负责定时开启、反馈进度以及取消/异常清理。
# 本文件不控制车辆行进中的广域通道 1，也不替代 MissionManager 的任务门控。
wvcsc_spray_actuator:
  ros__parameters:
    action_name: /spray/execute
    # The real arm launch must drive the physical relay controller.  The
    # timer mode is simulation-only and would make a spray action look
    # successful without switching any hardware output.
    spray_mode: service
    relay_service_name: /relay/set
    relay_channel: 2
    relay_service_timeout_sec: 2.0
    active_topic: /spray/simulated_active
    motion_locked_topic: /motion_control/locked
    min_duration: 0.2
    max_duration: 10.0
