wvcsc_visual_servo:
  ros__parameters:
    control_rate_hz: 30.0
    # The recorded C10 real-arm trial showed the U-axis error increasing under
    # the nominal mapping.  Keep V unchanged and reverse only U.
    angular_u_sign: -1.0
    angular_v_sign: 1.0
    direction_guard_enabled: true
    direction_guard_window_sec: 1.0
    direction_guard_min_error_px: 20.0
    direction_guard_max_growth_px: 10.0
    direction_guard_min_confidence: 0.60
    default_timeout_sec: 16.0
    target_stale_timeout_sec: 0.50
    min_confidence: 0.4
    aim_range_source: goal
    aim_range_min_m: 0.20
    aim_range_max_m: 2.00
    aim_nozzle_frame: spray_nozzle_link
    aim_min_forward_axis_z: 0.2
    aim_image_margin_px: 60.0
    desired_offset_u_px: 0.0
    desired_offset_v_px: 0.0

    # Conservative initial real-arm limits.  Tune only from recorded data.
    max_angular_speed: 0.15
    max_angular_acceleration: 1.00
    pid_kp_xy: 5.00
    pid_kd_xy: 0.005
    # Segmentation noise was measured around 6.4 px; require a stable 8 px
    # nozzle-aim residual instead of an unachievable 1.5 px real-arm gate.
    fine_tolerance_px: 8.0
    control_resume_tolerance_px: 8.0
    stable_duration_sec: 0.50
    zero_command_count: 8
