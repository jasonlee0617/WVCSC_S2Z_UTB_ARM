# nav2_sim.yaml
# ============================================================================
# Nav2 (Navigation2) 仿真环境参数配置文件
# ============================================================================
#
# 本文件定义了 Gazebo 仿真中阿克曼小车导航所需的所有参数。
# 针对阿克曼转向特性，采用了 SmacPlannerHybrid (Reeds-Shepp) 规划器
# 和 Regulated Pure Pursuit 控制器，以稳定跟踪人工记录的路线并完成精确停靠。
# 所有模块启用了 `use_sim_time: true` 以与 Gazebo 仿真时钟同步。
#

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""            # 地图文件路径，在 Launch 中动态传入

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # 所有任务点使用同一条路线行为树；MissionManager 不再按点覆盖 Nav2 行为树。
    default_nav_to_pose_bt_xml: navigate_route.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    # Nav2 行为树插件库注册列表 (确保所有用到的插件均已加载)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0       # 20 Hz 控制频率
    # 任务、代价地图和里程计均以地面投影点为基准。显式设置，避免
    # ControllerServer 回退到 Nav2 默认的 base_link 而造成终点语义漂移。
    robot_base_frame: base_footprint
    odom_topic: /odom
    min_x_velocity_threshold: 0.001  # 最小线速度检测死区
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # 代价地图刚更新时，单个控制周期可能暂时没有可用解。期间控制器保持
    # 零速度，2 s 后才交给行为树恢复处理，避免短暂更新直接中止导航。
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [route_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 接近 10 cm 停靠容差时，5 cm 位移即可证明仍在推进，避免将正常的
      # 末段减速误判为 "Failed to make progress"。
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    route_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
    # Regulated Pure Pursuit 直接跟踪当前全局路径。它保留碰撞预测，
    # 但不把膨胀层代价额外转化为减速，以免病株停车位附近长期停滞。
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.65
      lookahead_time: 1.20
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.80
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.575
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      allow_reversing: true
      max_angular_accel: 0.50
      transform_tolerance: 0.3

# ---------------- 局部代价地图 (用于短距离实时避障) ----------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true           # 随车滑动的滚动窗口
      width: 8                       # 8m x 8m 范围
      height: 8
      resolution: 0.05               # 5cm/像素 的高精度地图
      footprint: "[[0.725, -0.375], [0.725, 0.375], [-0.725, 0.375], [-0.725, -0.375]]" # 车身覆盖范围
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
      inflation_layer:                # 膨胀层 (增大障碍物使小车安全绕过)
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 2.0
      always_send_full_costmap: true

# ---------------- 全局代价地图 (用于全局长程规划) ----------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: false      # 地图环境是已知的，不追踪未知空间
      footprint: "[[0.725, -0.375], [0.725, 0.375], [-0.725, 0.375], [-0.725, -0.375]]"
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 2.0
      always_send_full_costmap: true

# ---------------- 全局路径规划器 ----------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid  # 混合状态 Smac 规划器
      # 机械臂任务使用人工记录的精确停车位。若允许规划器以邻近自由点
      # 替代原始目标，再叠加 GoalChecker 容差，Nav2 会在距停车位约
      # 0.35 m 处报告成功，导致任务层拒绝机械臂作业。
      # 因此仿真必须精确规划到原始 base_footprint 目标；不可达时明确失败。
      tolerance: 0.00
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: REEDS_SHEPP        # 运动学模型：Reeds-Shepp (适配合并阿克曼的进退)
      angle_quantization_bins: 72                  # 航向角离散化分桶
      analytic_expansion_ratio: 3.5                # 解析扩展 (终点附近的运动学解析解)
      analytic_expansion_max_length: 6.5
      minimum_turning_radius: 1.575
      reverse_penalty: 2.0
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true

# ---------------- 轨迹平滑器 ----------------
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ---------------- 行为服务器 (原地旋转/后退/等待) ----------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

# ---------------- 路径点跟随器 ----------------
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

# ---------------- 速度平滑器 ----------------
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.35, 0.0, 0.22]     # [vx, vy, wz] 的最大限制
    min_velocity: [-0.15, 0.0, -0.22]
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
